<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Coming Soon | Pass & Play Zone</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap");

    :root {
      --lime: #baff00;
      --green: #0b4b27;
      --dark: #030705;
      --white: #f5fff4;
      --muted: rgba(245, 255, 244, 0.62);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--white);
      background: var(--dark);
      font-family: "Inter", sans-serif;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(
          ellipse at 50% 100%,
          rgba(34, 151, 67, 0.7),
          transparent 55%
        ),
        linear-gradient(180deg, #020403 0%, #07150d 52%, #0c3c23 100%);
    }

    /* Animated football turf grid */
    .page::before {
      content: "";
      position: absolute;
      z-index: -3;
      inset: 0;
      opacity: 0.32;
      background-image:
        linear-gradient(rgba(186, 255, 0, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(186, 255, 0, 0.12) 1px, transparent 1px);
      background-size: 70px 70px;
      transform:
        perspective(480px)
        rotateX(61deg)
        scale(2.2)
        translateY(39%);
      transform-origin: center bottom;
      animation: turfMove 8s linear infinite;
    }

    .page::after {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 20%,
          rgba(0, 0, 0, 0.8) 100%
        ),
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.82),
          transparent 30%,
          transparent 70%,
          rgba(0, 0, 0, 0.82)
        );
    }

    .topbar {
      position: absolute;
      z-index: 10;
      top: 28px;
      left: 5vw;
      right: 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeDown 1s ease both;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--white);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .logo-mark {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border: 2px solid var(--lime);
      border-radius: 50%;
      color: var(--lime);
      font-size: 17px;
      box-shadow: 0 0 22px rgba(186, 255, 0, 0.4);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 14px var(--lime);
      animation: pulse 1.5s infinite;
    }

    .hero {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 110px 22px 60px;
      text-align: center;
    }

    .hero-content {
      width: 100%;
      max-width: 850px;
      animation: heroIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      color: var(--lime);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--lime);
      box-shadow: 0 0 9px var(--lime);
    }

    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(80px, 16vw, 190px);
      font-weight: 400;
      line-height: 0.78;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
    }

    h1 span {
      display: block;
      color: var(--lime);
      text-shadow: 0 0 32px rgba(186, 255, 0, 0.32);
    }

    .subtitle {
      max-width: 510px;
      margin: 30px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    /* Countdown */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    .time-box {
      min-width: 74px;
      padding: 13px 10px 11px;
      border: 1px solid rgba(186, 255, 0, 0.32);
      border-radius: 12px;
      background: rgba(4, 18, 10, 0.65);
      box-shadow:
        inset 0 0 20px rgba(186, 255, 0, 0.04),
        0 0 18px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
    }

    .time-box strong {
      display: block;
      color: var(--lime);
      font-family: "Bebas Neue", sans-serif;
      font-size: 38px;
      font-weight: 400;
      line-height: 0.9;
    }

    .time-box small {
      display: block;
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .notify-form {
      display: flex;
      max-width: 430px;
      margin: 30px auto 0;
      padding: 5px;
      border: 1px solid rgba(186, 255, 0, 0.35);
      border-radius: 100px;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(10px);
    }

    .notify-form input {
      min-width: 0;
      flex: 1;
      padding: 13px 16px;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
    }

    .notify-form input::placeholder {
      color: rgba(255, 255, 255, 0.48);
    }

    .notify-form button {
      padding: 13px 20px;
      border: 0;
      border-radius: 100px;
      color: #061006;
      background: var(--lime);
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: 0.3s ease;
    }

    .notify-form button:hover {
      background: white;
      transform: scale(1.03);
    }

    .message {
      min-height: 18px;
      margin-top: 10px;
      color: var(--lime);
      font-size: 11px;
    }

    /* Stadium lights */
    .light {
      position: absolute;
      z-index: 1;
      top: -12%;
      width: 18%;
      height: 90%;
      opacity: 0.16;
      filter: blur(22px);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 220, 0.9),
        rgba(255, 255, 220, 0)
      );
      transform-origin: top;
      animation: lightMove 5s ease-in-out infinite alternate;
    }

    .light.left {
      left: 12%;
      transform: rotate(19deg);
    }

    .light.right {
      right: 12%;
      transform: rotate(-19deg);
      animation-delay: -2s;
    }

    .light-center {
      position: absolute;
      z-index: 1;
      top: 2%;
      left: 50%;
      width: 2px;
      height: 70%;
      opacity: 0.13;
      background: white;
      box-shadow: 0 0 70px 30px white;
      transform: translateX(-50%);
      animation: flicker 3s infinite;
    }

    /* Field circle */
    .field-circle {
      position: absolute;
      z-index: 0;
      left: 50%;
      bottom: -17%;
      width: min(95vw, 980px);
      height: min(42vw, 430px);
      border: 2px solid rgba(186, 255, 0, 0.34);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 25px rgba(186, 255, 0, 0.12);
    }

    .field-circle::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: rgba(186, 255, 0, 0.23);
      transform: translateX(-50%);
    }

    /* Football */
    .ball {
      position: absolute;
      z-index: 8;
      left: 8%;
      bottom: 14%;
      width: clamp(58px, 8vw, 94px);
      aspect-ratio: 1;
      animation: ballRoll 8s cubic-bezier(0.55, 0.05, 0.45, 0.95)
        infinite;
    }

    .ball img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter:
        drop-shadow(0 15px 8px rgba(0, 0, 0, 0.62))
        drop-shadow(0 0 8px rgba(255, 255, 255, 0.18));
      animation: ballSpin 1.5s linear infinite;
    }

    .ball::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 12%;
      right: 12%;
      bottom: -10px;
      height: 10px;
      border-radius: 50%;
      background: #000;
      filter: blur(8px);
      opacity: 0.7;
    }

    .particle {
      position: absolute;
      z-index: 2;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 12px var(--lime);
      animation: float 5s ease-in-out infinite;
    }

    .p1 {
      top: 31%;
      left: 19%;
      animation-delay: -1s;
    }

    .p2 {
      top: 28%;
      left: 78%;
      animation-delay: -3s;
    }

    .p3 {
      top: 69%;
      left: 88%;
      animation-delay: -2s;
    }

    .p4 {
      top: 72%;
      left: 11%;
      animation-delay: -4s;
    }

    .p5 {
      top: 18%;
      left: 67%;
      animation-delay: -1.5s;
    }

    .scroll {
      position: absolute;
      z-index: 10;
      bottom: 25px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    .scroll-line {
      width: 45px;
      height: 1px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.25);
    }

    .scroll-line::after {
      content: "";
      display: block;
      width: 15px;
      height: 100%;
      background: var(--lime);
      animation: scrollLine 1.8s infinite;
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes turfMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 140px;
      }
    }

    @keyframes lightMove {
      from {
        opacity: 0.1;
      }

      to {
        opacity: 0.28;
      }
    }

    @keyframes flicker {
      0%,
      100% {
        opacity: 0.1;
      }

      48% {
        opacity: 0.18;
      }

      50% {
        opacity: 0.06;
      }

      52% {
        opacity: 0.18;
      }
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
        transform: scale(0.65);
      }
    }

    @keyframes float {
      0%,
      100% {
        opacity: 0.2;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-35px);
      }
    }

    @keyframes ballRoll {
      0% {
        left: 8%;
        transform: translateY(0);
      }

      45% {
        left: 50%;
        transform: translateY(-40px);
      }

      100% {
        left: 88%;
        transform: translateY(0);
      }
    }

    @keyframes ballSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes scrollLine {
      from {
        transform: translateX(-20px);
      }

      to {
        transform: translateX(50px);
      }
    }

    @media (max-width: 600px) {
      .topbar {
        top: 20px;
        left: 22px;
        right: 22px;
      }

      .logo {
        font-size: 12px;
      }

      .logo-mark {
        width: 29px;
        height: 29px;
        font-size: 14px;
      }

      .status {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .hero {
        padding-top: 90px;
      }

      h1 {
        font-size: clamp(76px, 23vw, 130px);
        line-height: 0.82;
      }

      .eyebrow {
        font-size: 8px;
        letter-spacing: 2.5px;
      }

      .subtitle {
        max-width: 305px;
        margin-top: 25px;
        font-size: 12px;
      }

      .countdown {
        gap: 6px;
        margin-top: 25px;
      }

      .time-box {
        min-width: 62px;
        padding: 11px 7px 9px;
      }

      .time-box strong {
        font-size: 30px;
      }

      .time-box small {
        font-size: 7px;
        letter-spacing: 1px;
      }

      .notify-form {
        max-width: 330px;
        margin-top: 24px;
      }

      .notify-form input {
        width: 100px;
        font-size: 11px;
      }

      .notify-form button {
        padding: 12px 14px;
        font-size: 9px;
      }

      .ball {
        bottom: 14%;
        width: 62px;
      }

      .field-circle {
        bottom: -5%;
        width: 145vw;
        height: 58vw;
      }

      .scroll {
        bottom: 18px;
      }
    }

    @media (max-height: 700px) {
      .hero {
        padding-top: 80px;
      }

      .eyebrow {
        margin-bottom: 16px;
      }

      .subtitle {
        margin-top: 20px;
      }

      .countdown {
        margin-top: 20px;
      }

      .notify-form {
        margin-top: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="topbar">
      <div class="logo">
        <div class="logo-mark">⚽</div>
        Pass & Play Zone
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Opening soon
      </div>
    </header>

    <div class="light left"></div>
    <div class="light right"></div>
    <div class="light-center"></div>

    <div class="field-circle"></div>

    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
    <span class="particle p5"></span>

    <main class="hero">
      <div class="hero-content">

        <div class="eyebrow">The pitch is getting ready</div>

        <h1>
          Coming
          <span>Soon</span>
        </h1>

        <p class="subtitle">
          A new football experience is coming to town. Get ready to play,
          compete and create unforgettable moments under the lights.
        </p>

        <div class="countdown">
          <div class="time-box">
            <strong id="days">00</strong>
            <small>Days</small>
          </div>

          <div class="time-box">
            <strong id="hours">00</strong>
            <small>Hours</small>
          </div>

          <div class="time-box">
            <strong id="minutes">00</strong>
            <small>Minutes</small>
          </div>

          <div class="time-box">
            <strong id="seconds">00</strong>
            <small>Seconds</small>
          </div>
        </div>

        <form class="notify-form" id="notifyForm">
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

          <button type="submit">
            Notify me
          </button>
        </form>

        <div class="message" id="message"></div>

      </div>
    </main>

    <div class="ball">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg"
        alt="Football"
      />
    </div>

    <div class="scroll">
      <span class="scroll-line"></span>
      Game on
      <span class="scroll-line"></span>
    </div>

  </div>

  <script>
    /*
      Countdown date.
      এই date পরিবর্তন করে আপনার launch date বসান।
      Format: "Month Day, Year HH:MM:SS"
    */

    const launchDate = new Date("November 30, 2026 18:00:00").getTime();

    const daysElement = document.getElementById("days");
    const hoursElement = document.getElementById("hours");
    const minutesElement = document.getElementById("minutes");
    const secondsElement = document.getElementById("seconds");

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = launchDate - now;

      if (distance <= 0) {
        daysElement.textContent = "00";
        hoursElement.textContent = "00";
        minutesElement.textContent = "00";
        secondsElement.textContent = "00";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
      );
      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) / (1000 * 60)
      );
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysElement.textContent = String(days).padStart(2, "0");
      hoursElement.textContent = String(hours).padStart(2, "0");
      minutesElement.textContent = String(minutes).padStart(2, "0");
      secondsElement.textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const notifyForm = document.getElementById("notifyForm");
    const emailInput = document.getElementById("email");
    const message = document.getElementById("message");

    notifyForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!emailInput.value) return;

      message.textContent = "Thanks! We will notify you when we launch.";
      emailInput.value = "";
    });
  </script>
</body>
</html>
